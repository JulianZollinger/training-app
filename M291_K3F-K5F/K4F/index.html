<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K4F – JSON als HTML anzeigen</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem}
    .controls{display:flex;gap:.5rem;align-items:center;margin-bottom:1rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
    .card{border:1px solid #ccc;border-radius:8px;padding:1rem;border-left-width:6px}
    .card h3{margin:.2rem 0}
    .Run{border-left-color:#e67e22}.Ride{border-left-color:#2980b9}.Swim{border-left-color:#16a085}.other{border-left-color:#888}
    .hard{font-weight:bold;color:#c0392b}
    .error{background:#fde8e8;border:1px solid #c00;color:#900;padding:.75rem;border-radius:6px}
  </style>
</head>
<body>
  <h1>Meine Aktivitäten</h1>
  <div class="controls">
    <label for="filter">Sportart:</label>
    <select id="filter"><option value="all">Alle</option></select>
    <button id="reload">Neu laden</button>
  </div>
  <div id="error" class="error" hidden></div>
  <p id="summary"></p>
  <div id="list" class="grid"></div>

  <script src="config.js"></script>
  <script>
    let activities = [];

    function request() {
      if (CONFIG.DEMO_MODE) return ["sample-data.json", {}];
      const newest = new Date().toISOString().slice(0, 10);
      const oldest = new Date(Date.now() - 28 * 864e5).toISOString().slice(0, 10);
      return [`https://intervals.icu/api/v1/athlete/${CONFIG.ATHLETE_ID}/activities?oldest=${oldest}&newest=${newest}`,
              { headers: { Authorization: "Basic " + btoa("API_KEY:" + CONFIG.API_KEY) } }];
    }

    function formatDuration(sec) {                       // 2760 -> "46 min" / "1 h 15 min"
      const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
      return h > 0 ? `${h} h ${m} min` : `${m} min`;
    }

    function render() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      const selected = document.getElementById("filter").value;
      const shown = activities.filter(a => selected === "all" || a.type === selected);   // filtern

      shown.sort((a, b) => b.start_date_local.localeCompare(a.start_date_local));        // sortieren

      let totalKm = 0;
      for (const a of shown) {                                                          // Schleife
        const km = (a.distance || 0) / 1000;
        totalKm += km;
        const card = document.createElement("article");
        const cls = ["Run", "Ride", "Swim"].includes(a.type) ? a.type : "other";          // Fallunterscheidung
        card.className = "card " + cls;
        const hard = a.icu_training_load >= 80 ? ' <span class="hard">(harte Einheit)</span>' : "";
        card.innerHTML = `
          <small>${new Date(a.start_date_local).toLocaleDateString("de-CH")} · ${a.type}</small>
          <h3></h3>
          <p>${km.toFixed(1)} km · ${formatDuration(a.moving_time)}</p>
          <p>Training Load: ${a.icu_training_load ?? "–"}${hard}</p>`;
        card.querySelector("h3").textContent = a.name || "Ohne Titel";                   // textContent = sicher
        list.appendChild(card);
      }
      document.getElementById("summary").textContent =
        `${shown.length} Aktivitäten, total ${totalKm.toFixed(1)} km`;
    }

    function fillFilter() {
      const select = document.getElementById("filter");
      const types = [...new Set(activities.map(a => a.type))];
      select.length = 1;
      types.forEach(t => select.add(new Option(t, t)));
    }

    async function load() {
      const err = document.getElementById("error");
      err.hidden = true;
      try {
        const [url, options] = request();
        const res = await fetch(url, options);
        if (!res.ok) throw new Error(`Status ${res.status} ${res.statusText}`);
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) throw new Error("Keine sinnvollen Daten erhalten.");
        activities = data;
        fillFilter();
        render();
      } catch (e) {
        err.textContent = "Fehler: " + e.message;
        err.hidden = false;
      }
    }

    document.getElementById("filter").addEventListener("change", render);
    document.getElementById("reload").addEventListener("click", load);
    load();
  </script>
</body>
</html>
