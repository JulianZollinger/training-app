<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K3F – JSON asynchron laden</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem}
    pre{background:#f4f4f4;padding:1rem;overflow:auto;max-height:320px}
    .error{background:#fde8e8;border:1px solid #c00;color:#900;padding:.75rem;border-radius:6px}
    .ok{color:#060}
  </style>
</head>
<body>
  <h1>K3F – Daten von intervals.icu laden</h1>
  <button id="load">Aktivitäten laden</button>
  <p id="status" aria-live="polite"></p>
  <div id="error" class="error" hidden></div>
  <pre id="output">Noch keine Daten geladen.</pre>

  <script src="config.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const errorEl  = document.getElementById("error");
    const outputEl = document.getElementById("output");

    function showError(msg) {
      errorEl.textContent = "Fehler: " + msg;
      errorEl.hidden = false;
      outputEl.textContent = "Keine Daten.";
    }

    function buildRequest() {
      if (CONFIG.DEMO_MODE) return { url: "sample-data.json", options: {} };
      const newest = new Date().toISOString().slice(0, 10);
      const oldest = new Date(Date.now() - 14 * 864e5).toISOString().slice(0, 10);
      return {
        url: `https://intervals.icu/api/v1/athlete/${CONFIG.ATHLETE_ID}/activities?oldest=${oldest}&newest=${newest}`,
        options: { headers: { Authorization: "Basic " + btoa("API_KEY:" + CONFIG.API_KEY) } }
      };
    }

    async function loadData() {
      errorEl.hidden = true;
      statusEl.textContent = "Lade …";
      try {
        const { url, options } = buildRequest();
        const response = await fetch(url, options);          // asynchroner Request
        if (!response.ok) {                                   // HTTP-Statuscode prüfen
          throw new Error(`Server antwortet mit Status ${response.status} (${response.statusText})`);
        }
        const data = await response.json();                   // kann fehlschlagen, wenn kein JSON
        if (!Array.isArray(data) || data.length === 0) {      // sinnvolle Daten?
          throw new Error("Der Dienst lieferte keine sinnvollen JSON-Daten (leere oder falsche Struktur).");
        }
        outputEl.textContent = JSON.stringify(data, null, 2);
        statusEl.innerHTML = `<span class="ok">${data.length} Aktivitäten geladen.</span>`;
      } catch (err) {
        statusEl.textContent = "";
        showError(err.message);                               // Netzwerk-/CORS-Fehler landen auch hier
      }
    }

    document.getElementById("load").addEventListener("click", loadData);
  </script>
</body>
</html>
